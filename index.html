<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Photography and cinematography portfolio.">
<style>
:root{--bg:#131410;--gold:#e8d8a2;--mute:#a69c78;--line:rgba(232,216,162,.2);--disp:Charter,"Bitstream Charter","Sitka Text",Cambria,serif;--serif:Charter,"Bitstream Charter","Sitka Text",Cambria,serif;--sans:system-ui,sans-serif;--ease:cubic-bezier(.16,.8,.1,1)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);scroll-behavior:smooth}
body{background:var(--bg);color:var(--gold);font:400 1rem/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.home{overflow:hidden;height:100svh}
a{color:inherit;text-decoration:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.view{display:none}
.view.on{display:block;animation:in 1.1s var(--ease) both}
.view.out{display:block;animation:ot .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(4vh)}}
@keyframes ot{to{opacity:0;transform:translateY(-2vh)}}
/* home: three lanes — a media strip, the words "Film / Photo", a media strip.
   Hovering a word fills both strips with that section (videos or a photo reel). */
#v-home{position:relative;height:100svh;overflow:hidden}
.top{position:absolute;top:1.8rem;left:3vw;right:3vw;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline}
.top>:last-child{justify-self:end}
.ini{font-weight:700;letter-spacing:.06em}
.tl{display:flex;gap:1.1rem;align-items:baseline}
.tc{color:var(--mute);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.nm{white-space:nowrap;font:500 clamp(1.15rem,1.8vw,1.65rem)/1 var(--disp);letter-spacing:.03em}
.bt{position:absolute;left:3vw;right:3vw;bottom:2.2rem;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.bt>:last-child{justify-self:end}
.soc{display:flex;gap:1.3rem}
.soc a{display:block;width:18px;height:18px;opacity:.85;transition:opacity .3s}
.soc a:hover{opacity:1}
.soc svg{display:block;width:100%;height:100%}
.u{border-bottom:1px solid transparent;transition:border-color .3s}
.u:hover{border-color:var(--gold)}
.home-stage{position:absolute;inset:0;display:flex}
.lanes{width:100%;display:flex;flex-direction:column}
.lane{position:relative;flex:1 1 0;overflow:hidden;pointer-events:none}
.ly{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
body[data-h=c] .lv,body[data-h=p] .lp{opacity:1}
.lv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease}
.lv video.s{opacity:1}
.track{display:flex;gap:.6rem;height:100%;width:max-content;animation:reel 70s linear infinite}
.track img{display:block;height:100%;width:auto}
#laneB .track{animation-direction:reverse}
@keyframes reel{to{transform:translateX(-50%)}}
body:not([data-h=p]) .track{animation-play-state:paused}
.words{position:relative;display:flex;justify-content:center;gap:clamp(.4rem,1.6vw,1.4rem);padding:clamp(.6rem,1.4vh,.85rem) 0;border-block:1px solid var(--gold);transition:border-color .5s ease}
/* a dashed line always drifting through the lane; each word sits on a patch of page colour, so the line breaks around it */
.words::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:repeating-linear-gradient(90deg,var(--gold) 0 12px,transparent 12px 22px);opacity:.5;transition:opacity .5s ease;animation:flow 1.4s linear infinite;-webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
@keyframes flow{to{background-position:-22px 0}}
body[data-h] .words{border-color:transparent}
body[data-h] .words::before{opacity:0}
.w{position:relative;padding:0 .5em;background:var(--bg);font:500 clamp(1.1rem,1.8vw,1.65rem)/1 var(--disp);text-transform:uppercase;letter-spacing:.14em;transition:color .4s ease;animation:fl 2.6s ease-in-out infinite}
.w.p{animation-delay:.3s}
@keyframes fl{50%{transform:translateY(-.18em)}}
body[data-h] .w{animation:none}
#v-home .top,#v-home .bt{transition:opacity .5s ease}
body[data-h] #v-home .top,body[data-h] #v-home .bt{opacity:0;pointer-events:none}
body[data-h=c] .w.c,body[data-h=p] .w.p{color:#fff4d6}
body[data-h=c] .w.p,body[data-h=p] .w.c{color:rgba(232,216,162,.4)}
@media(hover:none){.lane{visibility:hidden}}
/* bar + pages */
#bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:baseline;padding:1.3rem 3vw 2.5rem;background:linear-gradient(var(--bg) 35%,transparent);opacity:0;pointer-events:none;transition:opacity .6s}
body:not(.home) #bar{opacity:1;pointer-events:auto}
#bar div{display:flex;gap:2rem;font-size:.95rem}
#bar div a{color:var(--mute);transition:color .3s}
#bar div a:hover,#bar div a.cur{color:var(--gold)}
#nmx{font:italic 500 1.5rem/1 var(--disp)}
.pg{padding:20vh 3vw 10vh}
.hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:1.2rem;margin-bottom:12vh}
.hd h1{font:500 clamp(3rem,9vw,9rem)/.95 var(--disp);letter-spacing:-.02em}
.hd span{color:var(--mute);font-size:.9rem}
.rv{opacity:0;transform:translateY(5vh);transition:opacity 1.2s ease,transform 1.5s var(--ease)}
.rv.in{opacity:1;transform:none}
.gx{display:grid;grid-template-columns:repeat(12,1fr);column-gap:2vw;row-gap:14vh;align-items:start}
.film{grid-column:var(--c)}
.frame{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;cursor:pointer}
.frame img{display:block;width:100%;height:100%;object-fit:cover;transition:transform 1.8s var(--ease),opacity .6s}
.frame:hover img{transform:scale(1.035);opacity:.85}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pb{position:absolute;left:1rem;bottom:.9rem;font-size:.9rem}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-top:.8rem}
.cap h3{font:400 clamp(1.3rem,2vw,2rem)/1.1 var(--serif)}
.cap span{color:var(--mute);font-size:.9rem;text-align:right}
.sl{display:grid;row-gap:22vh;margin-bottom:24vh}
.row{display:flex;justify-content:center;align-items:flex-start;gap:2vw}
.fav{display:flex;flex-direction:column;align-items:center}
.fav img{display:block;width:auto;height:auto;max-width:100%;max-height:92svh}
.n1 .fav{max-width:94vw}
.n2 .fav{max-width:46vw}
.big{display:flex;flex-direction:column;align-items:var(--j)}
.big img{display:block;max-width:min(100%,var(--w));max-height:88svh;width:auto;height:auto}
.ph{cursor:zoom-in}
.ph img{background:var(--line);transition:opacity .6s}
.ph:hover img{opacity:.85}
.pgrid .ph{grid-column:var(--c);margin-top:calc(var(--o)*1vw)}
.pgrid img{display:block;width:100%;height:auto;min-height:10rem}
.pgrid .big img{width:auto}
.pgrid{row-gap:9vh}
.ph figcaption{margin-top:.45rem;color:var(--mute);font-size:.8rem}
.ab{display:grid;grid-template-columns:repeat(12,1fr);column-gap:2vw}
.ab p{grid-column:4/12;font:400 clamp(1.7rem,3.6vw,3.4rem)/1.18 var(--serif);letter-spacing:-.01em}
.ab ul{grid-column:4/9;list-style:none;margin-top:3.5rem;color:var(--mute);column-count:2}
#em{display:block;width:max-content;max-width:100%;margin-left:auto;font:italic 500 clamp(2rem,7.5vw,8rem)/1.05 var(--disp);letter-spacing:-.02em;overflow-wrap:anywhere;border-bottom:1px solid transparent;transition:border-color .3s}
#em:hover{border-color:var(--gold)}
#ig{display:block;width:max-content;margin:2.5rem 0 0 auto;font-size:1.1rem}
#lb{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:7vh 4vw;background:rgba(19,20,16,.97)}
#lb.on{display:flex;animation:in .5s ease both}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
.lbb{position:fixed;background:none;border:0;color:var(--gold);font:inherit;cursor:pointer}
.x{top:1.2rem;right:3vw}.prv{bottom:1.2rem;left:3vw}.nxt{bottom:1.2rem;right:3vw}
@media(max-width:720px){
#bar div{gap:1rem;font-size:.85rem}#nmx{display:none}
.film,.pgrid .ph{grid-column:1/-1;margin-top:0}.pgrid .ph:nth-child(even){width:78%;justify-self:end}
.row{flex-direction:column;align-items:center}.n2 .fav,.n1 .fav{max-width:100%}
.big{align-items:center}.big img{max-width:100%}.ab p,.ab ul{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.w,.words::before{animation:none}.rv{opacity:1;transform:none;transition:none}}
</style>
</head>

<script>
/* ============ EDIT ONLY THIS BLOCK ============ */
const SITE = {
  name: "Abhilash Dutta",
  role: "Photographer and cinematographer",
  email: "abhilashduttta@gmail.com",
  instagram: "https://www.instagram.com/abhilashd_",
  youtube: "https://www.youtube.com/@GrindingA",
  about: "I developed feelings for nature when our family moved to Guwahati in 2007. I wanted to cherish my memories, so I learned to click photos using my father's camera, who also had a passion for photography and cinematography. Since then, I’ve shot several portraits and landscapes around me",
  services: ["Photography", "Cinematography", "Colour grading"],
  folder: "photos/", ext: "jpg",
  favs: [[1], [25, 26], [8], [36]],   // your favourites, shown huge. [25, 26] = two side by side
  more: [6,37,38,14,15,27,16,19,20,21,24,28,17,22,23,33,34,35,29,30,31,32],
  large: [27, 28]     // photos in the list above that get shown bigger
};
const FILMS = [       // id = the part after v= in the YouTube link
  { id: "jEhxQ_7oEMI", title: "Greens",       year: "2026", role: "Cinematography" },
  { id: "f44YVhao46c", title: "Coffee",                    year: "2026", role: "Cinematography" },
  { id: "90lVdO0Toyo", title: "Post Cards from Munsyari",  year: "2026", role: "Cinematography" },
  { id: "FW3b2_Bomf4", title: "Somewhere in Lucknow",      year: "", role: "Cinematography" }
];
/* ============ END OF EDIT BLOCK ============ */

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)], pad = n => String(n).padStart(2, "0");
const src = n => SITE.folder + n + "." + SITE.ext;
const ALL = [...SITE.favs.flat(), ...SITE.more];
document.title = SITE.name + ", " + SITE.role;
$("#nm").textContent = $("#nmx").textContent = SITE.name;
$("#ini").textContent = SITE.name.split(" ").map(w => w[0]).join("");
$("#sig").href = SITE.instagram; $("#syt").href = SITE.youtube;
/* camera-style timecode beside AD: hh:mm:ss:ff at 24fps since the page opened */
const tc = $("#tc"), t0 = performance.now();
setInterval(() => { const f = Math.floor((performance.now() - t0) / (1000 / 24)), sec = Math.floor(f / 24);
  tc.textContent = [Math.floor(sec / 3600), Math.floor(sec / 60) % 60, sec % 60, f % 24].map(pad).join(":"); }, 1000 / 24);
$("#cn").textContent = FILMS.length + " films"; $("#pn").textContent = ALL.length + " photographs";
$("#ab").textContent = SITE.about;
$("#svc").innerHTML = SITE.services.map(s => `<li>${s}</li>`).join("");
$("#em").textContent = SITE.email; $("#em").href = "mailto:" + SITE.email; $("#ig").href = SITE.instagram;

/* films page */
const FL = [[1,9],[5,8],[2,8],[6,7]];
$("#fg").innerHTML = FILMS.map((f, i) => { const [c, s] = FL[i % 4];
  return `<article class="film rv" style="--c:${c} / span ${s}"><div class="frame" tabindex="0" role="button" aria-label="Play ${f.title}" data-v="${i}"><img src="https://i.ytimg.com/vi/${f.id}/maxresdefault.jpg" alt="" loading="lazy" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${f.id}/hqdefault.jpg'"><span class="pb">Play</span></div><div class="cap"><h3>${f.title}</h3><span>${[f.year, f.role].filter(Boolean).join(", ")}</span></div></article>`; }).join("");

/* photography page */
const fig = (n, style, cls) => `<figure class="ph rv ${cls}" data-n="${n}" style="${style}"><img src="${src(n)}" alt="Photograph ${n}" loading="lazy" decoding="async"><figcaption>${pad(n)}</figcaption></figure>`;
$("#sl").innerHTML = SITE.favs.map(r => `<div class="row n${r.length}">${r.map(n => fig(n, "", "fav")).join("")}</div>`).join("");
const PL = [[1,7,0],[9,4,14],[4,5,4],[1,4,0],[6,3,10],[10,3,2],[2,6,0],[9,4,18],[5,4,0],[1,5,6],[8,5,0]]; let lg = 0;
$("#pgr").innerHTML = SITE.more.map((n, i) => {
  if (SITE.large.includes(n)) return fig(n, `--c:1 / -1;--o:0;--j:${lg++ % 2 ? "flex-end" : "flex-start"};--w:46vw`, "big");
  const [a, s, o] = PL[i % PL.length]; return fig(n, `--c:${a} / span ${s};--o:${o}`, ""); }).join("");
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
$$(".rv").forEach(el => io.observe(el));

/* home: hovering "Film" plays cuts of the films in both strips (staggered);
   hovering "Photo" scrolls a reel of photos through them (opposite directions).
   Self-hosted muted <video> (videos/c0.mp4, ... in FILMS order), so no YouTube chrome. */
const CLIPS = FILMS.map((_, i) => "videos/c" + i + ".mp4");
const LANES = [$("#laneT"), $("#laneB")];
// Two <video>s per strip that swap clips, and hidden ones drop their source. Browsers allow
// ~6 connections per server and each buffering video holds one; with a video per clip per
// strip, the last clips and every photo could wait forever on a slow connection.
LANES.forEach(l => l.innerHTML = `<div class="ly lv"><video muted loop playsinline></video><video muted loop playsinline></video></div><div class="ly lp"><div class="track"></div></div>`);
const VS = LANES.map(l => [...l.querySelectorAll("video")]), N = [0, 2];
VS.flat().forEach(v => v.muted = true);
let mode = "", tok = 0, T = [];
const ready = v => new Promise(r => { if (v.readyState >= 2) return r(v); const ok = () => r(v);
  v.addEventListener("loadeddata", ok, { once: true }); v.addEventListener("playing", ok, { once: true }); setTimeout(ok, 4000); });
const free = v => { v.classList.remove("s"); v.pause(); v.removeAttribute("src"); v.load(); };
const load = k => { const v = VS[k].find(x => !x.classList.contains("s")), c = CLIPS[N[k]++ % CLIPS.length];
  if (v.getAttribute("src") !== c) v.src = c;
  v.play().catch(() => {}); return ready(v); };
const cut = (k, v) => { const o = VS[k].find(x => x !== v); v.classList.add("s"); o.classList.remove("s");
  setTimeout(() => { if (!o.classList.contains("s")) free(o); }, 900); };
const reel = (k, t, d = 3800) => load(k).then(v => { if (t !== tok) return; cut(k, v); T[k] = setTimeout(() => reel(k, t), d); });
VS.forEach((vs, k) => { vs[0].preload = "auto"; vs[0].src = CLIPS[N[k]]; });   // warm up each strip's first clip
let built = false;
const buildPhotos = () => { if (built) return; built = true;
  const o = [...ALL].sort(() => Math.random() - .5);
  [o.slice(0, 10), o.slice(10, 20)].forEach((set, k) => {
    const imgs = set.map(n => `<img src="${src(n)}" alt="" loading="lazy" decoding="async">`).join("");
    LANES[k].querySelector(".track").innerHTML = imgs + imgs; }); };   // doubled so the loop is seamless
const setMode = m => { if (m === mode) return;
  // words stop floating while active; ease them from wherever they are back to the shared baseline
  const from = !mode && m ? $$(".w").map(w => getComputedStyle(w).transform) : null;
  mode = m; const t = ++tok; T.forEach(clearTimeout);
  if (m) document.body.dataset.h = m; else delete document.body.dataset.h;
  if (from) $$(".w").forEach((w, i) => w.animate([{ transform: from[i] }, { transform: "none" }], { duration: 350, easing: "ease-out" }));
  if (m === "c") Promise.all([load(0), load(1)]).then(([a, b]) => { if (t !== tok) return;   // first clips appear together
    cut(0, a); cut(1, b);
    T[0] = setTimeout(() => reel(0, t), 3800); T[1] = setTimeout(() => reel(1, t), 5700); });   // later cuts alternate
  else setTimeout(() => { if (mode !== "c") VS.flat().forEach(free); }, 800);   // frees connections for photos
  if (m === "p") buildPhotos(); };

// leaving a word resets after a short grace, so crossing from FILM to PHOTO doesn't blink the strips
let L;
$$(".w").forEach(a => {
  a.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") { clearTimeout(L); setMode(a.dataset.k); } });
  a.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") L = setTimeout(() => setMode(""), 150); });
  a.addEventListener("focus", () => { if (a.matches(":focus-visible")) setMode(a.dataset.k); });
  a.addEventListener("blur", e => { if (!e.relatedTarget?.matches(".w")) setMode(""); }); });

/* pages: smooth hand-over between views */
let curV = null;
function route() {
  let r = location.hash.replace(/^#\/?/, "") || "home";
  const next = $("#v-" + r) || $("#v-home"); if (!$("#v-" + r)) r = "home";
  const prev = curV; if (prev === next) return;
  const done = () => { if (prev) prev.classList.remove("on", "out"); next.classList.add("on"); curV = next;
    document.body.classList.toggle("home", r === "home"); scrollTo(0, 0);
    $$("#bar div a").forEach(a => a.classList.toggle("cur", a.dataset.r === r));
    setMode(""); };
  if (prev) { prev.classList.add("out"); setTimeout(done, 480); } else done();
}
addEventListener("hashchange", route); route();

/* viewer + film player */
const lb = $("#lb"); let cur = 0;
const open = html => { lb.innerHTML = html + `<button class="lbb x">Close</button>`; lb.className = "on"; };
const shut = () => { lb.className = ""; lb.innerHTML = ""; };
const show = i => { cur = (i + ALL.length) % ALL.length;
  open(`<img src="${src(ALL[cur])}" alt=""><button class="lbb prv">Previous</button><button class="lbb nxt">Next</button>`); };
document.addEventListener("click", e => {
  const v = e.target.closest("[data-v]"), p = e.target.closest(".ph");
  if (v) { if (!v.querySelector("iframe")) v.innerHTML = `<iframe src="https://www.youtube.com/embed/${FILMS[v.dataset.v].id}?autoplay=1&rel=0&modestbranding=1&playsinline=1" allow="autoplay;fullscreen;encrypted-media" allowfullscreen></iframe>`; }
  else if (p) show(ALL.indexOf(+p.dataset.n));
  else if (e.target.closest(".nxt")) show(cur + 1);
  else if (e.target.closest(".prv")) show(cur - 1);
  else if (e.target.closest(".x") || e.target === lb) shut();
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.v) e.target.click();
  if (!lb.className) return;
  if (e.key === "Escape") shut();
  if (e.key === "ArrowRight") show(cur + 1); if (e.key === "ArrowLeft") show(cur - 1);
});
</script>
