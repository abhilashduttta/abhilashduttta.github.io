<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Photography and cinematography portfolio.">
<link rel="preload" href="fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Satoshi;src:url(fonts/satoshi-300.woff2) format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:Satoshi;src:url(fonts/satoshi-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Satoshi;src:url(fonts/satoshi-500.woff2) format("woff2");font-weight:500;font-display:swap}
:root{--bg:#131410;--gold:#e8d8a2;--mute:#a69c78;--line:rgba(232,216,162,.2);--disp:"Satoshi",system-ui,sans-serif;--serif:Charter,"Bitstream Charter","Sitka Text",Cambria,serif;--sans:"Satoshi",system-ui,sans-serif;--ease:cubic-bezier(.16,.8,.1,1)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);scroll-behavior:smooth}
body{background:var(--bg);color:var(--gold);font:400 1rem/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.home{overflow:hidden;height:100svh}
a{color:inherit;text-decoration:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.view{display:none}
.view.on{display:block;animation:in 1.1s var(--ease) both}
.view.out{display:block;animation:ot .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(4vh)}}
@keyframes ot{to{opacity:0;transform:translateY(-2vh)}}
/* home: a quiet stage. Name on top; the two words and the social icons at the bottom.
Hovering a word fills the screen: film clips, or three photos side by side. */
#v-home{position:relative;height:100svh;overflow:hidden}
.stage{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .9s ease}
body[data-h=c] .sc,body[data-h=p] .sp{opacity:1}
.sc video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s ease}
.sc video.s{opacity:1}
.sp{display:flex}
.pcol{position:relative;flex:1 1 0;overflow:hidden}
.pcol img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.07);transition:opacity 1.2s ease,transform 7s cubic-bezier(.16,.8,.1,1)}
.pcol img.s{opacity:1;transform:none}
.shade{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .9s ease;background:linear-gradient(rgba(19,20,16,0) 55%,rgba(19,20,16,.55)),rgba(19,20,16,.14)}
body[data-h] .shade{opacity:1}
.top{position:absolute;top:2rem;left:3vw;right:3vw;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;transition:opacity .9s ease;animation:rise 1.8s var(--ease) .2s backwards}
.nm{white-space:nowrap;font:500 clamp(1.1rem,1.6vw,1.8rem)/1 var(--disp);letter-spacing:.05em}
.dock{position:absolute;left:3vw;right:3vw;bottom:clamp(2.2rem,7vh,4.5rem);z-index:5;display:flex;flex-direction:column;gap:clamp(1.6rem,4.4vh,3rem);animation:rise 1.8s var(--ease) .5s backwards}
.words{display:flex;justify-content:center;align-items:baseline;gap:clamp(3rem,9vw,10rem)}
.w{padding:.8rem .5rem;font:300 clamp(2.2rem,4.4vw,4.8rem)/1 var(--disp);letter-spacing:-.035em;transition:color .6s ease,opacity .6s ease}
body[data-h] .w{color:#fff4d6;text-shadow:0 2px 36px rgba(19,20,16,.55)}
body[data-h] .top{opacity:0;pointer-events:none}
body[data-h=p] .w.c,body[data-h=c] .w.p{opacity:0}
.top>:last-child{justify-self:end}
.u{font:500 .78rem/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;opacity:.82;transition:opacity .4s ease,color .4s ease}
.u:hover{opacity:1;color:#fff4d6}
@keyframes rise{from{opacity:0;transform:translateY(1.4vh)}}
@media(max-width:720px){
.words{flex-direction:column;align-items:center;gap:.25rem;padding-bottom:2vh}.w{font-size:clamp(2.35rem,10.5vw,3.5rem);padding:.65rem .5rem;z-index:4}
.stage{display:block;inset:0}.sp{display:block}.pcol{display:none}.pcol:first-child{display:block;width:100%;height:100%}
.top{top:max(1.4rem,env(safe-area-inset-top));left:5vw;right:5vw}.dock{left:5vw;right:5vw;bottom:max(1.6rem,env(safe-area-inset-bottom));gap:1.8rem}
.u{font-size:.7rem;letter-spacing:.18em}
}

/* bar + pages */
#bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:baseline;padding:1.3rem 3vw 2.5rem;background:linear-gradient(var(--bg) 35%,transparent);opacity:0;pointer-events:none;transition:opacity .6s}
body:not(.home) #bar{opacity:1;pointer-events:auto}
#bar div{display:flex;gap:2rem;font-size:.95rem}
#bar div a{color:var(--mute);transition:color .3s}
#bar div a:hover,#bar div a.cur{color:var(--gold)}
#nmx{font:500 1.15rem/1 var(--disp);letter-spacing:.04em}
#menub{display:none;background:none;border:0;color:var(--gold);padding:.35rem;cursor:pointer}
#menub span{display:block;width:1.35rem;height:1px;background:currentColor;margin:.3rem 0;transition:transform .25s ease,opacity .25s ease}
#bar.menu-open #menub span:first-child{transform:translateY(.2rem) rotate(45deg)}
#bar.menu-open #menub span:last-child{transform:translateY(-.2rem) rotate(-45deg)}
.pg{padding:20vh 3vw 10vh}
.hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:1.2rem;margin-bottom:12vh}
.hd h1{font:300 clamp(3rem,8.5vw,9rem)/.95 var(--disp);letter-spacing:-.045em}
.hd span{color:var(--mute);font-size:.9rem}
.rv{opacity:0;transform:translateY(5vh);transition:opacity 1.2s ease,transform 1.5s var(--ease)}
.rv.in{opacity:1;transform:none}
.gx{display:grid;grid-template-columns:repeat(12,1fr);column-gap:2vw;row-gap:14vh;align-items:start}
/* cinematography: a newspaper front page of moving pictures */
#v-cinematography .pg{padding-top:clamp(5rem,10vh,7rem)}
.news{display:grid;grid-template-columns:repeat(12,1fr)}
.story{padding:2.2rem 1.4vw 2.6rem}
.s0{grid-column:1/7;padding-left:0}
.s1{grid-column:7/13;padding-right:0}
.s2{grid-column:1/7;padding-left:0}
.s3{grid-column:7/13;padding-right:0}
.pic{position:relative}
.s1 .pic::before,.s3 .pic::before{content:"";position:absolute;left:-1.4vw;top:0;bottom:0;border-left:1px solid var(--line)} /* column rule runs alongside the picture + caption only */
.story h3{margin-bottom:1.1rem;font:400 clamp(1.5rem,2.6vw,2.6rem)/1.05 var(--disp);letter-spacing:-.01em}
.frame{position:relative;aspect-ratio:4/3;background:#000;overflow:hidden;cursor:pointer;outline:1px solid var(--line);outline-offset:4px}
.frame video{display:block;width:100%;height:100%;object-fit:cover;transition:transform 1.8s var(--ease),opacity .6s}
.frame:hover video{transform:scale(1.035);opacity:.85}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pb{position:absolute;left:1rem;bottom:.9rem;font-size:.85rem;letter-spacing:.08em;text-shadow:0 0 12px rgba(0,0,0,.7)}
.yr{margin-left:.9rem;font:.75rem/1 var(--sans);letter-spacing:.2em;color:var(--mute)}
.note{margin-top:.9rem;color:var(--mute);font:italic 400 .95rem/1.4 var(--sans)}
@media(max-width:720px){.news .story{grid-column:1/-1;padding:1.8rem 0}.pic::before{display:none}}
.gallery-kicker,.archive-head{display:flex;justify-content:space-between;align-items:baseline;color:var(--mute);font:.68rem/1 var(--sans);letter-spacing:.2em;text-transform:uppercase}.gallery-kicker{padding-bottom:1.2rem;border-bottom:1px solid var(--line);margin-bottom:8vh}.sl{display:grid;row-gap:24vh;margin-bottom:22vh}.row{display:flex;justify-content:center;align-items:flex-start;gap:2.5vw}.fav{display:flex;flex-direction:column;align-items:center}.#v-photography .pg{padding-top:11vh}.fav img{display:block;width:auto;height:auto;max-width:100%;max-height:86svh}.n1 .fav{max-width:78vw}.n2 .fav{max-width:43vw}.sl>.row:nth-child(3) .fav{max-width:64vw}.sl>.row:nth-child(4) .fav{max-width:82vw}.sl>.row:nth-child(5){gap:2vw}.sl>.row:nth-child(5) .fav{max-width:47vw}.big{display:flex;flex-direction:column;align-items:var(--j)}.big img{display:block;max-width:min(100%,var(--w));max-height:88svh;width:auto;height:auto}.ph{cursor:zoom-in}.ph img{background:var(--line);transition:opacity .6s,transform .8s var(--ease)}.ph:hover img{opacity:.9;transform:scale(1.008)}.pgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:2.5vw;row-gap:0;align-items:start}.pgrid .ph{margin:0 0 13vh;width:auto}.pgrid img{display:block;width:100%;height:auto;min-height:0}.pgrid .ph:nth-child(1){grid-column:1 / span 5}.pgrid .ph:nth-child(2){grid-column:8 / span 5;margin-top:13vh}.pgrid .ph:nth-child(3){grid-column:3 / span 5}.pgrid .ph:nth-child(4){grid-column:8 / span 6;margin-top:8vh}.pgrid .ph:nth-child(5){grid-column:1 / span 5;margin-top:5vh}.pgrid .ph:nth-child(6){grid-column:8 / span 5;margin-top:17vh}.pgrid .ph:nth-child(7){grid-column:2 / span 6}.pgrid .ph:nth-child(8){grid-column:9 / span 4;margin-top:10vh}.pgrid .ph:nth-child(9){grid-column:1 / span 7;margin-top:5vh}.pgrid .ph:nth-child(10){grid-column:8 / span 5;margin-top:15vh}.pgrid .ph:nth-child(11){grid-column:1 / span 7;margin-top:4vh}.pgrid .ph:nth-child(12){grid-column:9 / span 4;margin-top:11vh}.pgrid .ph:nth-child(13){grid-column:1 / span 6;margin-top:4vh}.pgrid .ph:nth-child(14){grid-column:8 / span 5;margin-top:18vh}.pgrid .ph:nth-child(15){grid-column:2 / span 5}.pgrid .ph:nth-child(16){grid-column:7 / span 6;margin-top:8vh}.pgrid .ph:nth-child(17){grid-column:1 / span 5;margin-top:4vh}.pgrid .ph:nth-child(18){grid-column:7 / span 6;margin-top:16vh}.pgrid .ph:nth-child(19){grid-column:3 / span 5}.pgrid .ph:nth-child(20){grid-column:9 / span 4;margin-top:10vh}.pgrid .ph:nth-child(21){grid-column:1 / span 6;margin-top:5vh}.pgrid .ph:nth-child(22){grid-column:8 / span 5;margin-top:17vh}.ph figcaption{margin-top:.55rem;color:var(--mute);font-size:.68rem;letter-spacing:.08em}.archive-head{margin-bottom:8vh;padding-bottom:1.2rem;border-bottom:1px solid var(--line)}
.ab{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,32vw);column-gap:7vw;align-items:center;min-height:58vh}
.ab p{grid-column:1;font:400 clamp(1.45rem,2.65vw,2.65rem)/1.3 var(--serif);letter-spacing:-.012em;max-width:850px}
.ab ul{grid-column:1;list-style:none;margin-top:3rem;color:var(--mute);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem 2rem;max-width:560px;font-size:.9rem;letter-spacing:.03em}
.ab-photo{grid-column:2;grid-row:1 / span 2;justify-self:end;width:clamp(230px,28vw,390px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:1px solid var(--line);background:#000;box-shadow:0 18px 60px rgba(0,0,0,.16)}
.ab-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 43%;filter:grayscale(100%)}
@media(max-width:720px){.ab{display:grid;grid-template-columns:1fr;gap:3rem;min-height:0}.ab-photo{grid-column:1;grid-row:1;justify-self:center;width:min(68vw,300px)}.ab p{grid-column:1;font-size:1.5rem;line-height:1.35}.ab ul{grid-column:1;grid-template-columns:1fr 1fr;margin-top:2.2rem}}
#em{display:block;width:max-content;max-width:100%;margin-left:auto;font:300 clamp(2rem,7vw,8rem)/1.05 var(--disp);letter-spacing:-.04em;overflow-wrap:anywhere;border-bottom:1px solid transparent;transition:border-color .3s}
#em:hover{border-color:var(--gold)}
.cl{display:block;width:max-content;margin:1rem 0 0 auto;font-size:1.1rem}
#ig{margin-top:2.5rem}
#lb{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:7vh 4vw;background:rgba(19,20,16,.97)}
#lb.on{display:flex;animation:in .5s ease both}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
.lbb{position:fixed;background:none;border:0;color:var(--gold);font:inherit;cursor:pointer}
.x{top:1.2rem;right:3vw}.prv{bottom:1.2rem;left:3vw}.nxt{bottom:1.2rem;right:3vw}
@media(max-width:720px){
#bar{padding:max(1rem,env(safe-area-inset-top)) 5vw 1rem;background:linear-gradient(var(--bg) 55%,transparent);align-items:center}
body:not(.home) #bar{background:var(--bg)}
#nmx{display:block;font-size:1rem}
#menub{display:block;margin-left:auto;position:relative;z-index:31}
#navlinks{position:fixed;inset:0;background:var(--bg);display:flex!important;flex-direction:column;justify-content:center;align-items:flex-start;gap:1.2rem;padding:5rem 10vw 3rem;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility .3s ease;z-index:30}
#bar.menu-open #navlinks{opacity:1;visibility:visible;pointer-events:auto}
#navlinks a{font:300 clamp(2.1rem,9vw,3.4rem)/1 var(--disp);letter-spacing:-.035em;color:var(--gold)!important}
.pgrid .ph{grid-column:1/-1;margin-top:0}.pgrid .ph:nth-child(even){width:78%;justify-self:end}
.row{flex-direction:column;align-items:center}.n2 .fav,.n1 .fav{max-width:100%}
.big{align-items:center}.big img{max-width:100%}.ab p,.ab ul{grid-column:1/-1}
#v-cinematography .pg{padding-top:12vh}.story{padding:1.5rem 0 3.5rem}.story h3{font-size:1.65rem}.note{font-size:.82rem}
#v-photography .pg{padding-top:12vh}.gallery-kicker{margin-bottom:7vh;font-size:.61rem}.sl{row-gap:16vh;margin-bottom:15vh}.fav img{max-width:92vw;max-height:70svh}.n2 .fav{max-width:43vw}.sl>.row:nth-child(3) .fav{max-width:82vw}.sl>.row:nth-child(4) .fav{max-width:90vw}.sl>.row:nth-child(5){gap:2vw}.sl>.row:nth-child(5) .fav{max-width:47vw}.archive-head{margin-bottom:5vh;font-size:.59rem}.pgrid{grid-template-columns:1fr;column-gap:0}.pgrid .ph,.pgrid .ph:nth-child(n){grid-column:1;margin:0 0 12vh;width:100%;justify-self:start}.pgrid .ph:nth-child(2n){width:82%;justify-self:end;margin-top:4vh}.pgrid .ph:nth-child(3n){width:90%;justify-self:start;margin-top:1vh}.pgrid .ph:nth-child(4n){width:76%;justify-self:end;margin-top:3vh}.pgrid .ph:nth-child(5n){width:94%;justify-self:start;margin-top:0}
#v-about .pg{padding-top:13vh}.ab{gap:2.5rem}.ab-photo{width:min(62vw,250px)}.ab p{font-size:1.45rem;line-height:1.4}.ab ul{margin-top:1.8rem;font-size:.78rem}
#v-contact .pg{padding-top:13vh}#em{font-size:clamp(1.8rem,8vw,3.2rem);margin-left:0}.cl{margin-left:0}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.top,.dock{animation:none}.rv{opacity:1;transform:none;transition:none}}

/* photography archive (after photos 36 and 38): rows are built from each photo's real proportions.
   Change --mh to make everything bigger or smaller (share of screen height a photo may use). */
@media(min-width:721px){#v-photography .sl{row-gap:18vh;margin-bottom:18vh}}
@media(max-width:720px){#v-photography .sl{row-gap:9vh;margin-bottom:10vh}}
.parc{display:flex;flex-direction:column;gap:8vh}
.prow{--mh:82svh;display:flex;align-items:flex-start;gap:2vw;width:100%;margin:0 auto;max-width:calc(var(--mh)*var(--s,1) + 2vw*var(--g,0))}
.prow.one:not(.pt){--mh:80svh}
.prow .ph{min-width:0;margin:0}
.prow .ph img{display:block;width:100%;height:auto}
.prow .ph figcaption{margin-top:.6rem}
@media(max-width:720px){.parc{gap:4.5vh}.prow{max-width:none;gap:3vw}.prow.pt{width:94%;margin:0}.prow.pt.r{margin-left:auto}.prow.one:not(.pt){width:96%;}.prow.one:not(.pt).r{margin-left:auto}.prow .ph figcaption{margin-top:.45rem}.prow .ph img{max-width:100%;height:auto}}

</style>
</head>
<body class="home">
<nav id="bar"><a id="nmx" href="#/"></a><button id="menub" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button><div id="navlinks"><a data-r="cinematography" href="#/cinematography">Cinematography</a><a data-r="photography" href="#/photography">Photography</a><a data-r="about" href="#/about">About</a><a data-r="contact" href="#/contact">Contact</a></div></nav>
<main>
<section class="view" id="v-home">
<div class="stage sc" id="sc"></div><div class="stage sp" id="sp"></div><div class="shade"></div>
<div class="top"><a class="u" href="#/contact">Contact</a><div class="nm" id="nm"></div><a class="u" href="#/about">About</a></div>
<div class="dock">
<div class="words"><a class="w p" data-k="p" href="#/photography">Photography</a><a class="w c" data-k="c" href="#/cinematography">Cinematography</a></div>
</div>

<section class="view" id="v-cinematography"><div class="pg"><div class="news" id="fg"></div></div></section>

<section class="view" id="v-about"><div class="pg"><div class="ab rv"><div><p id="ab"></p><ul id="svc"></ul></div><div class="ab-photo"><img src="about.jpg" alt="Photographer standing on a sand dune with a camera" loading="lazy" decoding="async"></div></div></div></section>
<section class="view" id="v-contact"><div class="pg"><div class="hd rv"><h1>Contact</h1></div><a id="em" class="rv"></a><a id="ig" class="rv cl" target="_blank" rel="noopener">Instagram</a><a id="yt" class="rv cl" target="_blank" rel="noopener">YouTube</a><a id="ph" class="rv cl"></a></div></section>
</main>
<div id="lb"></div>
<script>
/* ============ EDIT ONLY THIS BLOCK ============ */
const SITE = {
name: "Abhilash Dutta",
role: "Photographer and cinematographer",
email: "abhilashduttta@gmail.com",
instagram: "https://www.instagram.com/abhilashd_",
youtube: "https://www.youtube.com/@GrindingA",
phone: "+91 7002403078",
about: "I’m a photographer and filmmaker interested in turning ordinary moments into images that feel deliberate. My work moves between photography and cinematography, with a focus on composition, natural light, atmosphere, and visual storytelling. I’m still exploring what the camera can say.",
services: ["Photography", "Cinematography", "Adobe Lightroom", "Da Vinci Resolve"],
folder: "photos/", ext: "jpg",
favs: [[1], [25, 26], [8], [37], [36, 38]], // selected photographs. 36 and 38 are paired; 37 stands alone.
more: [6,14,15,27,28,19,20,21,24,16,17,22,23,35,34,31,29,30,33,32],
large: {}, // archive is handled by the editorial masonry layout below
reel: [25,26,36,14,15,16,19,20,21,24,28,22,23,33,34,35] // portrait photos the home screen shows when you hover Photography
};
const FILMS = [ // id = the part after v= in the YouTube link. Each film also needs two clips:
// videos/c<n>.mp4 (home strips) and videos/p<n>.mp4 (films page), n = its position from 0
{ id: "jEhxQ_7oEMI", title: "Greens", year: "2026", role: "Cinematography", note: "Sony ZV-E10" },
{ id: "f44YVhao46c", title: "Coffee", year: "2026", role: "Cinematography", note: "Sony ZV-E10 · Nikon AF-S Nikkor 50mm f/1.8G" },
{ id: "90lVdO0Toyo", title: "Post Cards from Munsyari", year: "2026", role: "Cinematography", note: "Sony ZV-E10" },
{ id: "FW3b2_Bomf4", title: "Somewhere in Lucknow", year: "2026", role: "Cinematography", note: "iPhone 17 Pro · open gate" }
];
/* ============ END OF EDIT BLOCK ============ */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)], pad = n => String(n).padStart(2, "0");
const src = n => SITE.folder + n + "." + SITE.ext;
const ALL = [...SITE.favs.flat(), ...SITE.more];
document.title = SITE.name + ", " + SITE.role;
$("#nm").textContent = $("#nmx").textContent = SITE.name;
$("#ab").textContent = SITE.about;
$("#svc").innerHTML = SITE.services.map(s => `<li>${s}</li>`).join("");
$("#em").textContent = SITE.email; $("#em").href = "mailto:" + SITE.email; $("#ig").href = SITE.instagram; $("#yt").href = SITE.youtube; $("#ph").textContent = SITE.phone; $("#ph").href = "tel:" + SITE.phone.replace(/\s/g, "");

const fig = (n, style, cls) => `<figure class="ph rv ${cls}" data-n="${n}" style="${style}"><img src="${src(n)}" alt="Photograph ${n}" loading="lazy" decoding="async"><figcaption>${pad(n)}</figcaption></figure>`;
$("#sl").innerHTML = SITE.favs.map(r => `<div class="row n${r.length}">${r.map(n => fig(n, "", "fav")).join("")}</div>`).join("");
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
$$(".rv").forEach(el => io.observe(el));
/* photography archive: rows are built from each photo's real proportions, so portraits and landscapes stay balanced.
   Landscapes get a row of their own; portraits sit in pairs at equal height. Phones get one photo per row. */
const AR = {1:1.5,2:.6667,3:.6667,4:.6667,5:.6667,6:1.5,7:.6667,8:1.5,9:1.5,10:.6667,11:1.5,12:.6667,13:.6667,14:.6667,15:.6667,16:.6667,17:1.5,18:1.5,19:.6667,20:.6667,21:.6667,22:.8,23:.8,24:.8,25:.6667,26:.6667,27:1.5,28:.6667,29:.5625,30:1.5,31:.5625,32:.5625,33:.5625,34:.6667,35:.6667,36:.6667,37:1.5,38:1.5}, arcLoad = n => new Promise(r => { if (AR[n]) return r(); const i = new Image(); i.onload = () => { AR[n] = i.naturalWidth / i.naturalHeight; r(); }; i.onerror = () => { AR[n] = .8; r(); }; i.src = src(n); });
let arcMobile = null, arcReady = false, arcStarted = false, arcT;
const arcBuild = () => {
const mob = matchMedia("(max-width:720px)").matches; if (mob === arcMobile) return; arcMobile = mob;
const L = SITE.more, W = innerWidth * .94, G = innerWidth * .02, VH = innerHeight, rows = [];
for (let i = 0; i < L.length; i++) { const a = L[i], b = L[i + 1];
if (!mob && AR[a] < 1.15 && b !== undefined && Math.min((W - G) / (AR[a] + AR[b]), VH * .82) >= VH * .5) { rows.push([a, b]); i++; } else rows.push([a]); }
let k = 0;
$("#pgr").innerHTML = rows.map(r => { const s = r.reduce((t, n) => t + AR[n], 0), pt = r.length === 1 && AR[r[0]] < 1.15;
return `<div class="prow${r.length === 1 ? " one" : ""}${pt ? " pt" : ""}${pt && k++ % 2 ? " r" : ""}" style="--s:${s.toFixed(3)};--g:${r.length - 1}">${r.map(n => `<figure class="ph rv" data-n="${n}" style="flex:${AR[n].toFixed(3)} 1 0%"><img src="${src(n)}" alt="Photograph ${n}" style="aspect-ratio:${AR[n]}" loading="lazy" decoding="async"><figcaption>${pad(n)}</figcaption></figure>`).join("")}</div>`; }).join("");
$$("#pgr .rv").forEach(el => io.observe(el)); };
const arcStart = () => { if (arcStarted) return; arcStarted = true; Promise.all(SITE.more.map(arcLoad)).then(() => { arcReady = true; arcBuild(); }); };
const arcCheck = () => { if (/photography/.test(location.hash)) arcStart(); };
arcCheck(); addEventListener("hashchange", arcCheck);
addEventListener("resize", () => { clearTimeout(arcT); arcT = setTimeout(() => arcReady && arcBuild(), 250); });
/* home: hovering a word fills the whole screen.
Cinematography: your self-hosted clips (videos/c0.mp4, c1.mp4 ... in FILMS order) cut one after another.
Photography: three portrait photos side by side (the "reel" list above), each changing in turn. */
const CLIPS = FILMS.map((_, i) => "videos/c" + i + ".mp4");
const SC = $("#sc"), SP = $("#sp");
SC.innerHTML = `<video muted loop playsinline></video><video muted loop playsinline></video>`;
SP.innerHTML = `<div class="pcol"></div><div class="pcol"></div><div class="pcol"></div>`;
const VV = [...SC.querySelectorAll("video")], COLS = [...SP.children];
VV.forEach(v => v.muted = true);
const ORDER = [...SITE.reel].sort(() => Math.random() - .5), PC = {};
const pre = n => PC[n] || (PC[n] = Object.assign(new Image(), { src: src(n), decoding: "async" }));
setTimeout(() => ORDER.slice(0, 4).forEach(pre), 2500); // warm up a few photos
let mode = "", tok = 0, ci = 0, pi = 0, T = [];
const ready = v => new Promise(r => { if (v.readyState >= 2) return r(v); const ok = () => r(v);
v.addEventListener("loadeddata", ok, { once: true }); v.addEventListener("playing", ok, { once: true }); setTimeout(ok, 4000); });
const free = v => { v.classList.remove("s"); v.pause(); v.removeAttribute("src"); v.load(); };
const film = t => { if (t !== tok) return;
const v = VV.find(x => !x.classList.contains("s")), o = VV.find(x => x !== v), c = CLIPS[ci++ % CLIPS.length];
if (v.getAttribute("src") !== c) v.src = c;
v.play().catch(() => {});
ready(v).then(() => { if (t !== tok) return;
v.classList.add("s"); o.classList.remove("s");
setTimeout(() => { if (!o.classList.contains("s")) free(o); }, 1200);
T.push(setTimeout(() => film(t), 4300)); }); };
const photo = (k, t, first) => { if (t !== tok) return;
const im = pre(ORDER[pi++ % ORDER.length]);
const show = () => { if (t !== tok || !im.naturalWidth) return;
const col = COLS[k], el = document.createElement("img"); el.src = im.src; el.alt = "";
[...col.children].forEach(o => { o.classList.remove("s"); setTimeout(() => o.remove(), 1400); });
col.append(el); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("s"))); };
im.complete ? show() : im.addEventListener("load", show, { once: true });
pre(ORDER[pi % ORDER.length]);
T.push(setTimeout(() => photo(k, t), first ? 3500 + k * 1100 : 3600)); }; // columns change one after another
const setMode = m => { if (m === mode) return;
mode = m; const t = ++tok; T.forEach(clearTimeout); T = [];
if (m) document.body.dataset.h = m; else delete document.body.dataset.h;
if (m === "c") film(t); else setTimeout(() => { if (mode !== "c") VV.forEach(free); }, 1200);
if (m === "p") COLS.forEach((_, k) => photo(k, t, true)); else setTimeout(() => { if (mode !== "p") COLS.forEach(c => c.innerHTML = ""); }, 1300); };
// leaving a word resets after a short grace, so crossing between the two words doesn't flicker
let L;
$$(".w").forEach(a => {
a.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") { clearTimeout(L); setMode(a.dataset.k); } });
a.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") L = setTimeout(() => setMode(""), 250); });
a.addEventListener("focus", () => { if (a.matches(":focus-visible")) setMode(a.dataset.k); });
a.addEventListener("blur", e => { if (!e.relatedTarget?.matches(".w")) setMode(""); }); });
/* once the page is idle, quietly buffer the first clip in the background so the
first Cinematography hover is instant. This runs after load, so it never delays
the initial page, and only while the home screen is showing. */
let warmed = false;
const warmClip = () => { if (warmed || mode || !document.body.classList.contains("home")) return;
warmed = true; VV[0].preload = "auto"; if (!VV[0].getAttribute("src")) VV[0].src = CLIPS[0]; };
("requestIdleCallback" in window ? requestIdleCallback(warmClip, { timeout: 3500 }) : addEventListener("load", () => setTimeout(warmClip, 2500)));
/* mobile: tap once for the home preview, tap again to open the page */
let mobilePreview = "";
const isTouchLayout = () => window.matchMedia("(max-width:720px) and (hover:none)").matches;
$$('.w').forEach(a => a.addEventListener('click', e => {
  if (!isTouchLayout()) return;
  const k = a.dataset.k;
  if (mobilePreview !== k) { e.preventDefault(); mobilePreview = k; setMode(k); }
  else { mobilePreview = ""; setMode(""); }
}));
/* mobile navigation */
const bar = $("#bar"), menub = $("#menub"), navlinks = $("#navlinks");
const closeMenu = () => { bar.classList.remove("menu-open"); menub.setAttribute("aria-expanded", "false"); menub.setAttribute("aria-label", "Open menu"); };
menub.addEventListener("click", () => { const open = !bar.classList.contains("menu-open"); bar.classList.toggle("menu-open", open); menub.setAttribute("aria-expanded", String(open)); menub.setAttribute("aria-label", open ? "Close menu" : "Open menu"); });
navlinks.addEventListener("click", e => { if (e.target.closest("a")) closeMenu(); });
addEventListener("resize", () => { if (!isTouchLayout()) { mobilePreview = ""; setMode(""); closeMenu(); } });
/* pages: smooth hand-over between views */
let curV = null;
function route() {
let r = location.hash.replace(/^#\/?/, "") || "home";
const next = $("#v-" + r) || $("#v-home"); if (!$("#v-" + r)) r = "home";
const prev = curV; if (prev === next) return;
const done = () => { if (prev) prev.classList.remove("on", "out"); next.classList.add("on"); curV = next;
document.body.classList.toggle("home", r === "home"); scrollTo(0, 0);
$$("#bar div a").forEach(a => a.classList.toggle("cur", a.dataset.r === r));
mobilePreview = "";
setMode("");
closeMenu();
$$("#fg video").forEach(v => r === "cinematography" ? v.play().catch(() => {}) : v.pause()); };
if (prev) { prev.classList.add("out"); setTimeout(done, 480); } else done();
}
addEventListener("hashchange", route); route();
/* viewer + film player */
const lb = $("#lb"); let cur = 0;
const open = html => { lb.innerHTML = html + `<button class="lbb x">Close</button>`; lb.className = "on"; };
const shut = () => { lb.className = ""; lb.innerHTML = ""; };
const show = i => { cur = (i + ALL.length) % ALL.length;
open(`<img src="${src(ALL[cur])}" alt=""><button class="lbb prv">Previous</button><button class="lbb nxt">Next</button>`); };
document.addEventListener("click", e => {
const v = e.target.closest("[data-v]"), p = e.target.closest(".ph");
if (v) { if (!v.querySelector("iframe")) v.innerHTML = `<iframe src="https://www.youtube.com/embed/${FILMS[v.dataset.v].id}?autoplay=1&rel=0&modestbranding=1&playsinline=1" allow="autoplay;fullscreen;encrypted-media" allowfullscreen></iframe>`; }
else if (p) show(ALL.indexOf(+p.dataset.n));
else if (e.target.closest(".nxt")) show(cur + 1);
else if (e.target.closest(".prv")) show(cur - 1);
else if (e.target.closest(".x") || e.target === lb) shut();
});
document.addEventListener("keydown", e => {
if (e.key === "Enter" && e.target.dataset && e.target.dataset.v) e.target.click();
if (!lb.className) return;
if (e.key === "Escape") shut();
if (e.key === "ArrowRight") show(cur + 1); if (e.key === "ArrowLeft") show(cur - 1);
});
</script>
</body>
</html>
